<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>차 타마고치 캐릭터 목업</title><style>body{font-family:sans-serif;background:#f4f5f9;color:#222;max-width:760px;margin:24px auto;padding:0 16px}.cards{display:grid;gap:20px}.card{background:#fff;border-radius:14px;overflow:hidden}.card-body{padding:12px 16px}</style></head><body>
<h2>A를 더 귀엽게: 두 가지 방향</h2>
<p class="subtitle">둥글고 말랑하게, 눈은 크게 반짝이게, 볼터치를 넣었어. 각각 행복 / 시무룩 / 배고픔 표정이야.</p>

<style>
  .row{background:#1d2333;border-radius:18px;padding:22px 10px 12px;display:flex;justify-content:space-around;align-items:flex-end}
  .cell{display:flex;flex-direction:column;align-items:center;gap:14px;color:#cfd6ea;font-size:12px}
  .car{position:relative;width:130px;height:104px}
  .body{position:absolute;left:0;right:0;top:14px;bottom:10px;border-radius:50% 50% 38% 38%}
  .v1 .body{background:#8fb4ff;box-shadow:inset 0 -9px 0 #7aa0f0}
  .v2 .body{background:#8fe3c8;box-shadow:inset 0 -9px 0 #75d0b4;border-radius:46% 46% 32% 32%}
  .eye{position:absolute;top:34px;width:30px;height:34px;background:#fff;border-radius:50%}
  .v2 .eye{height:38px;top:30px}
  .eye.l{left:26px}.eye.r{right:26px}
  .p{position:absolute;left:7px;top:8px;width:17px;height:21px;background:#2b2f44;border-radius:50%}
  .p:before{content:"";position:absolute;left:3px;top:3px;width:7px;height:7px;background:#fff;border-radius:50%}
  .p:after{content:"";position:absolute;left:10px;top:12px;width:4px;height:4px;background:#fff;border-radius:50%}
  .sulky .p{top:14px}
  .sulky .eye:before{content:"";position:absolute;left:-3px;top:-4px;width:36px;height:5px;background:#2b2f44;border-radius:3px}
  .sulky .eye.l:before{transform:rotate(14deg)}
  .sulky .eye.r:before{transform:rotate(-14deg)}
  .cheek{position:absolute;top:68px;width:17px;height:9px;background:#ff9fb8;border-radius:50%;opacity:.85}
  .cheek.l{left:12px}.cheek.r{right:12px}
  .sulky .cheek{opacity:.25}
  .mouth{position:absolute;left:50px;top:72px;width:30px;height:14px;border:3px solid #2b2f44;border-top:none;border-radius:0 0 20px 20px}
  .sulky .mouth{top:80px;left:53px;width:24px;height:9px;border:3px solid #2b2f44;border-bottom:none;border-radius:20px 20px 0 0}
  .hungry .mouth{left:56px;top:72px;width:18px;height:19px;border:3px solid #2b2f44;border-radius:50%;background:#e56b7f}
  .mir{position:absolute;background:#6f94ea}
  .v1 .mir{top:36px;width:15px;height:24px;border-radius:50%}
  .v1 .mir.l{left:-9px}.v1 .mir.r{right:-9px}
  .v2 .mir{top:-6px;width:20px;height:44px;border-radius:50%;transform-origin:50% 100%;background:#75d0b4}
  .v2 .mir.l{left:20px;transform:rotate(-12deg)}
  .v2 .mir.r{right:20px;transform:rotate(12deg)}
  .v2 .car.sulky .mir.l{transform:rotate(-50deg)}
  .v2 .car.sulky .mir.r{transform:rotate(50deg)}
  .wh{position:absolute;bottom:0;width:26px;height:26px;background:#2b2f44;border-radius:50%;border:4px solid #9aa3bd;box-sizing:border-box}
  .wh.l{left:18px}.wh.r{right:18px}
  .sweat{position:absolute;right:6px;top:24px;font-size:16px}
</style>

<div class="cards">

  <div class="card" data-choice="v1-bubble" onclick="toggleSelect(this)">
    <div class="card-image">
      <div class="row v1">
        <div class="cell"><div class="car happy"><div class="mir l"></div><div class="mir r"></div><div class="body"></div><div class="eye l"><div class="p"></div></div><div class="eye r"><div class="p"></div></div><div class="cheek l"></div><div class="cheek r"></div><div class="mouth"></div><div class="wh l"></div><div class="wh r"></div></div>행복</div>
        <div class="cell"><div class="car sulky"><div class="mir l"></div><div class="mir r"></div><div class="body"></div><div class="eye l"><div class="p"></div></div><div class="eye r"><div class="p"></div></div><div class="cheek l"></div><div class="cheek r"></div><div class="mouth"></div><div class="wh l"></div><div class="wh r"></div></div>시무룩</div>
        <div class="cell"><div class="car hungry"><div class="mir l"></div><div class="mir r"></div><div class="body"></div><div class="eye l"><div class="p"></div></div><div class="eye r"><div class="p"></div></div><div class="cheek l"></div><div class="cheek r"></div><div class="mouth"></div><div class="wh l"></div><div class="wh r"></div><div class="sweat">💧</div></div>배고픔</div>
      </div>
    </div>
    <div class="card-body"><h3>1. 말랑 비틀형 (파랑)</h3><p>사이드미러가 귀처럼 옆에 붙어 있어. 풍선처럼 동글동글.</p></div>
  </div>

  <div class="card" data-choice="v2-bunny" onclick="toggleSelect(this)">
    <div class="card-image">
      <div class="row v2">
        <div class="cell"><div class="car happy"><div class="mir l"></div><div class="mir r"></div><div class="body"></div><div class="eye l"><div class="p"></div></div><div class="eye r"><div class="p"></div></div><div class="cheek l"></div><div class="cheek r"></div><div class="mouth"></div><div class="wh l"></div><div class="wh r"></div></div>행복</div>
        <div class="cell"><div class="car sulky"><div class="mir l"></div><div class="mir r"></div><div class="body"></div><div class="eye l"><div class="p"></div></div><div class="eye r"><div class="p"></div></div><div class="cheek l"></div><div class="cheek r"></div><div class="mouth"></div><div class="wh l"></div><div class="wh r"></div></div>시무룩 (귀가 축 처져)</div>
        <div class="cell"><div class="car hungry"><div class="mir l"></div><div class="mir r"></div><div class="body"></div><div class="eye l"><div class="p"></div></div><div class="eye r"><div class="p"></div></div><div class="cheek l"></div><div class="cheek r"></div><div class="mouth"></div><div class="wh l"></div><div class="wh r"></div><div class="sweat">💧</div></div>배고픔</div>
      </div>
    </div>
    <div class="card-body"><h3>2. 토끼 귀형 (민트)</h3><p>사이드미러가 토끼 귀처럼 위로 솟아. 기분이 나쁘면 귀가 처져서 표정이 더 잘 보여.</p></div>
  </div>

</div>
</body></html>
